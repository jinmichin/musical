name: Run Docker Image

on:
  schedule:
    # Run every hour
    - cron: '07 * * * *'
  workflow_dispatch:

concurrency:
  group: docker-run7
  cancel-in-progress: true

jobs:
  run-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # 5 hours 30 minutes

    steps:
      - name: Run Docker image
        run: |
          docker run \
            --cap-add=NET_ADMIN \
            --device=/dev/net/tun \
            jinmichin/jinb
